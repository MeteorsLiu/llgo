name: Qiniu Windows installation probe

on:
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: qiniu-windows-probe.yml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  probe:
    if: github.repository == 'xgo-dev/llgo' && github.event.pull_request.head.repo.full_name == 'MeteorsLiu/llgo' && github.event.pull_request.head.ref == 'codex/qiniu-windows'
    runs-on: ["qiniu", "windows-11"]
    timeout-minutes: 90
    steps:
      - name: Record initial disk space
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
      - name: Install 7-Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP '7zip.msi'
          Invoke-WebRequest -Uri 'https://github.com/ip7z/7zip/releases/download/26.05/7z2605-x64.msi' -OutFile $installer
          $process = Start-Process msiexec.exe -ArgumentList @('/i', $installer, '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "7-Zip installer failed: $($process.ExitCode)" }
          & "$env:ProgramFiles\7-Zip\7z.exe" i
          if ($LASTEXITCODE -ne 0) { throw "7-Zip verification failed: $LASTEXITCODE" }
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
      - name: Install Visual Studio 2022 C++ Build Tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vs_BuildTools.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList @('--quiet', '--wait', '--norestart', '--add', 'Microsoft.VisualStudio.Workload.VCTools', '--includeRecommended') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Visual Studio installer failed or requires restart: $($process.ExitCode)" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0) { throw "vswhere failed: $LASTEXITCODE" }
          if (-not (& $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)) { throw 'Visual Studio C++ tools not found' }
      - name: Record final disk space
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
